backend:
  name: git-gateway
  branch: main # якщо у твоєму репозиторії гілка називається "master" — зміни тут

media_folder: "img"
public_folder: "/img"

locale: "uk"

collections:
  - name: "products"
    label: "Товари"
    files:
      - file: "data/products.json"
        label: "Каталог товарів"
        name: "catalog"
        fields:
          - label: "Бруківка"
            name: "paving"
            widget: "list"
            summary: "{{title}} {{titleAccent}}"
            fields: &product_fields
              - { label: "Назва", name: "title", widget: "string" }
              - { label: "Уточнення до назви (курсивом)", name: "titleAccent", widget: "string", required: false }
              - { label: "Ціна", name: "price", widget: "string", default: "Уточнюйте" }
              - { label: "Опис", name: "description", widget: "text" }
              - label: "Характеристики"
                name: "features"
                widget: "list"
                fields:
                  - { label: "Назва параметра", name: "label", widget: "string" }
                  - { label: "Значення", name: "value", widget: "string" }
              - label: "Фото"
                name: "images"
                widget: "list"
                field: { label: "Зображення", name: "image", widget: "image" }

          - label: "Плити та плитка"
            name: "tiles"
            widget: "list"
            summary: "{{title}} {{titleAccent}}"
            fields: *product_fields

          - label: "Деталі пам'ятників"
            name: "monuments"
            widget: "list"
            summary: "{{title}} {{titleAccent}}"
            fields: *product_fields
